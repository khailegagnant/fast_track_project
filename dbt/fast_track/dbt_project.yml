name: 'fast_track'
version: '1.0.0'
config-version: 2

profile: 'fast_track'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Pipeline context
# ---------------------------------------------------------------------------
# Ergast-style F1 JSON is pulled from the API and landed in S3, exploded to
# parquet by a Glue/Spark job, then COPY INTO-ed to F1_CAPSTONE.RAW. dbt owns
# everything from RAW onward:
#
#   RAW (landed)  ->  staging  ->  silver  ->  mart
#                                     |
#                                     +-> snapshots (SCD Type 2, optional)
#
#   staging   : 1:1 with RAW. Select and rename only - no casting, no
#               cleaning, no business logic. Duplicates are preserved. Views.
#   silver    : typed, cleaned, deduplicated, conformed business entities.
#               This is where casting and data-quality logic lives. Tables.
#   snapshots : SCD Type 2 history of slv_f1__drivers/constructors attributes.
#               Not read by any fact - a standalone "browse history" layer.
#   mart      : dimensional model for consumption - conformed dimensions,
#               transaction facts, periodic-snapshot facts, and aggregated
#               metrics. Tables.
# ---------------------------------------------------------------------------

models:
  fast_track:
    +schema: F1_PIPELINE

    staging:
      f1-formula_one:
        +materialized: view
        +tags: ["staging", "f1"]

    silver:
      f1-formula_one:
        +materialized: table
        +tags: ["silver", "f1"]

    mart:
      +materialized: table
      +schema: marts
      +tags: ["mart", "f1"]

snapshots:
  fast_track:
    +schema: snapshots
    +tags: ["scd2_snapshot", "scd_type_2", "f1"]


flags:
  indirect_selection: cautious

vars:
  # Points awarded for a race win. Used by the standings snapshot tests to
  # assert that cumulative points are at least consistent with wins counted.
  f1_points_for_win: 25

  # How deep the championship countback compares finishing positions. The FIA
  # rule runs through the entire field; 24 covers every modern grid with room
  # to spare, and ties that survive 24 positions of race countback plus 24 of
  # qualifying countback are genuine dead heats.
  f1_countback_max_position: 24
