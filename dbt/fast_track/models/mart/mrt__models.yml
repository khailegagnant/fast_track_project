  # ===========================================================================
  # SCD Type 2 history - standalone, not joined to any fact
  # ===========================================================================

  - name: mrt__dim_drivers_history
    description: >
      Full SCD Type 2 version history of the driver entity, built from
      snap_f1__drivers. One row per historical version of a driver. Not
      joined to any fact - DRIVER_KEY is identical across every version of a
      driver, so joining this on DRIVER_KEY would fan out a fact row into N
      historical versions. Use mrt__dim_drivers for fact joins; use this
      table only to answer "what was true about this driver as of date X".
    config:
      materialized: table
      tags: ["mart", "f1", "dim", "driver", "history", "scd_type_2"]
      alias: "MRT__DIM_DRIVERS_HISTORY"
    columns:
      - name: DRIVER_VERSION_KEY
        description: >
          dbt-generated key uniquely identifying this one version row.
          Primary key of this table.
        data_type: VARCHAR
        data_tests:
          - not_null
          - unique
      - name: DRIVER_KEY
        description: >
          Surrogate key over (DRIVER_ID). Identical across every historical
          version of the same driver - do not use this as a join key into
          facts from this table.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: DRIVER_ID
        description: Ergast driver slug. Natural key, not unique in this table.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: DRIVER_CODE
        description: Three-letter broadcast abbreviation as of this version.
        data_type: VARCHAR
      - name: GIVEN_NAME
        description: Driver first name as of this version.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: FAMILY_NAME
        description: Driver surname as of this version.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: DRIVER_FULL_NAME
        description: Canonical full name as of this version.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: DRIVER_NATIONALITY
        description: Driver nationality as of this version.
        data_type: VARCHAR
      - name: PERMANENT_NUMBER
        description: Permanent car number as of this version.
        data_type: NUMBER
      - name: IS_CURRENT
        description: True for the one active version per DRIVER_KEY.
        data_type: BOOLEAN
        data_tests:
          - not_null
      - name: DATE_OF_BIRTH
        description: Driver date of birth as of this version.
        data_type: DATE
      - name: DBT_VALID_FROM
        description: Timestamp this version became active.
        data_type: TIMESTAMP
        data_tests:
          - not_null
      - name: DBT_VALID_TO
        description: Timestamp this version was superseded. NULL if current.
        data_type: TIMESTAMP
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - DRIVER_KEY
          config:
            where: "IS_CURRENT"
            alias: mrt__dim_drivers_history_one_current_version

  - name: mrt__dim_constructors_history
    description: >
      Full SCD Type 2 version history of the constructor entity, built from
      snap_f1__constructors. One row per historical version of a
      constructor. Not joined to any fact, for the same reason as
      mrt__dim_drivers_history - CONSTRUCTOR_KEY repeats across versions.

      Does not capture team rebrands (e.g. AlphaTauri -> RB): the source
      assigns a new CONSTRUCTOR_ID to a rebrand, so it is a new entity under
      this grain, not a new version of an existing one.
    config:
      materialized: table
      tags: ["mart", "f1", "dim", "constructor", "history", "scd_type_2"]
      alias: "MRT__DIM_CONSTRUCTORS_HISTORY"
    columns:
      - name: CONSTRUCTOR_VERSION_KEY
        description: >
          dbt-generated key uniquely identifying this one version row.
          Primary key of this table.
        data_type: VARCHAR
        data_tests:
          - not_null
          - unique
      - name: CONSTRUCTOR_KEY
        description: >
          Surrogate key over (CONSTRUCTOR_ID). Identical across every
          historical version of the same constructor.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: CONSTRUCTOR_ID
        description: Ergast constructor slug. Natural key, not unique here.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: CONSTRUCTOR_NAME
        description: Constructor display name as of this version.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: CONSTRUCTOR_NATIONALITY
        description: Constructor nationality as of this version.
        data_type: VARCHAR
      - name: IS_CURRENT
        description: True for the one active version per CONSTRUCTOR_KEY.
        data_type: BOOLEAN
        data_tests:
          - not_null
      - name: DBT_VALID_FROM
        description: Timestamp this version became active.
        data_type: TIMESTAMP
        data_tests:
          - not_null
      - name: DBT_VALID_TO
        description: Timestamp this version was superseded. NULL if current.
        data_type: TIMESTAMP
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - CONSTRUCTOR_KEY
          config:
            where: "IS_CURRENT"
            alias: mrt__dim_constructors_history_one_current_version
